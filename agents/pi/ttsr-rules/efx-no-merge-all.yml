id: efx-no-merge-all
language: TypeScript
severity: warning
message: Do not use `Layer.mergeAll` / `Layer.provideMerge` as blind compile-fixes
note: |
  `Layer.mergeAll(...)` and `Layer.provideMerge(...)` suppress dependency
  tracking errors without actually wiring the required layers. Explicitly
  provide each dependency so layer composition is auditable and correct.
rule:
  any:
    - pattern: Layer.mergeAll($$$)
    - pattern: Layer.provideMerge($$$)
