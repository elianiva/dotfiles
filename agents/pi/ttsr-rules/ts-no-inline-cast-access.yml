id: ts-no-inline-cast-access
language: TypeScript
severity: error
message: Do not assert an inline object type just to read a property
note: |
  `(value as { content: unknown }).content` trusts an unchecked shape.
  Validate with a schema parse at trust boundaries, narrow with `in`/`typeof`,
  or use a validated named type.
rule:
  any:
    - pattern: "($X as { $$$BODY }).$PROP"
    - pattern: "($X as { $$$BODY })?.$PROP"
    - pattern: "($X as { $$$BODY })[$IDX]"
