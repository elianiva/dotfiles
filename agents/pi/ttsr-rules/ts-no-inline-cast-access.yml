id: ts-no-inline-cast-access
language: TypeScript
severity: hint
message: Do not assert an inline object type just to read a property
note: |
  `(value as { content: unknown }).content` trusts an unchecked shape.
  In Effect projects, validate with a `Schema` parse at trust boundaries;
  otherwise narrow with `in`/`typeof` or use a validated named type. If the
  value was already validated upstream (schema parse or a trusted API), the
  cast is fine — dismiss this hint.
rule:
  any:
    - pattern: "($X as { $$$BODY }).$PROP"
    - pattern: "($X as { $$$BODY })?.$PROP"
    - pattern: "($X as { $$$BODY })[$IDX]"
