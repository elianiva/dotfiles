id: ts-no-test-timers
language: TypeScript
severity: hint
message: Review real timers in test files — prefer fake timers in unit tests
note: |
  Real delays add fixed latency and flakiness to unit tests.
  Use `vi.useFakeTimers()` and `vi.advanceTimersByTime()` instead (or
  `TestClock.adjust` in Effect tests). Integration tests that exercise real
  I/O — sockets, child processes, databases, cluster — legitimately need real
  timers; if the test does real I/O, dismiss this hint.
files:
  - "**/*.test.ts"
  - "**/*.test.tsx"
rule:
  any:
    - kind: call_expression
      regex: "^Bun\\.sleep"
    - kind: call_expression
      regex: "^setTimeout"
    - kind: call_expression
      regex: "^setInterval"
